[build-system]
requires = ["setuptools>=68.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "bilibili-api-python"
authors = [{ name = "Nemo2011", email = "yimoxia@outlook.com" }]
maintainers = [{ name = "MoyuScript" }, { name = "Nemo2011" }]
dynamic = ["version", "readme"] # 移除了 "dependencies"
license = { text = "GPL-3.0-or-later" }
description = "The fork of module bilibili-api. 哔哩哔哩的各种 API 调用便捷整合（视频、动态、直播等），另外附加一些常用的功能。"
requires-python = ">=3.10"
keywords = ["bilibili", "api", "spider"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
scripts = { "ivitools" = "bilibili_api.tools.ivitools.__main__:main" }
dependencies = [
    "beautifulsoup4",
    "colorama",
    "lxml",
    "pyyaml",
    "brotli",
    "qrcode",
    "APScheduler",
    "pillow",
    "yarl",
    "pycryptodomex",
    "qrcode_terminal",
    "PyJWT",
    "aiohttp>=3.9",
    "httpx>=0.27",
    "curl_cffi>=0.8.1",
]

[tool.setuptools.dynamic]
version = { attr = "bilibili_api.BILIBILI_API_VERSION" }
readme = { file = ["README.md"], content-type = "text/markdown" }

[tool.setuptools]
packages = [
    "bilibili_api",
    "bilibili_api.utils",
    "bilibili_api.exceptions",
    "bilibili_api.clients",
    "bilibili_api.tools",
    "bilibili_api.tools.ivitools",
    "bilibili_api.tools.parser",
    "bilibili_api._pyinstaller",
]

[tool.setuptools.package-data]
"*" = ["data/*.*", "data/**/*.*", "py.typed", "requirements.txt"]

[project.entry-points.pyinstaller40]
"hook-dirs" = "bilibili_api._pyinstaller.entry_points:get_hook_dirs"

[dependency-groups]
dev = [
    "ruff>=0.12",
    "pyrefly>=0.1",
    "pytest>=9.1.1",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "F", # Pyflakes
    "W", # pycodestyle warnings
    "E", # pycodestyle errors
    "I", # isort
    "UP", # pyupgrade
    "ASYNC", # flake8-async
    "C4", # flake8-comprehensions
    "T10", # flake8-debugger
    "T20", # flake8-print
    "PYI", # flake8-pyi
    "PT", # flake8-pytest-style
    "Q", # flake8-quotes
    "TID", # flake8-tidy-imports
    "RUF", # Ruff-specific rules
]
ignore = [
    "E402", # module-import-not-at-top-of-file
    "E501", # line-too-long：剩余项均位于字符串/docstring 内，交由 ruff format 管理代码行长
    "UP037", # quoted-annotation
    "RUF001", # ambiguous-unicode-character-string
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
    "RUF012", # mutable-class-default：大量 Enum 成员值为 dict，属有意设计
    "TID252", # relative-imports
]

[tool.ruff.lint.per-file-ignores]
# __init__.py 的导入顺序为避免循环引用精心设计，禁止重排
"bilibili_api/__init__.py" = ["I001"]
# parse_link.py 导入顺序为避免循环引用精心设计，禁止重排
"bilibili_api/utils/parse_link.py" = ["I001"]
# danmaku2ass.py 为上游遗留的第三方移植代码，含未定义变量等问题，待单独任务处理
"bilibili_api/utils/danmaku2ass.py" = ["E501", "F821", "F841", "E722", "UP031", "PYI056"]
# dynamic.py:813 jump_url 未定义为上游预存在问题（另立任务）
"bilibili_api/dynamic.py" = ["F821", "F841"]
# ivitools 为命令行工具，允许 print；PyQt6 探测导入
"bilibili_api/tools/**" = ["T201", "F401", "E722"]
# 上游有意在异步函数中使用阻塞 open/os.path（读取本地小文件），待后续引入 aiofiles 再改
"bilibili_api/**" = ["ASYNC230", "ASYNC240"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["src", "tests"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pyrefly]
project-includes = ["bilibili_api/**"]
project-excludes = ["tests/**", "docs/**", "scripts/**"]
