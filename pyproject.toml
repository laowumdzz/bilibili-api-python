[build-system]
requires = ["setuptools>=68.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "bilibili-api-python"
authors = [{ name = "Nemo2011", email = "yimoxia@outlook.com" }]
maintainers = [{ name = "MoyuScript" }, { name = "Nemo2011" }]
dynamic = ["version", "readme"] # 移除了 "dependencies"
license = { text = "GPL-3.0-or-later" }
description = "The fork of module bilibili-api. 哔哩哔哩的各种 API 调用便捷整合（视频、动态、直播等），另外附加一些常用的功能。"
requires-python = ">=3.10"
keywords = ["bilibili", "api", "spider"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
scripts = { "ivitools" = "bilibili_api.tools.ivitools.__main__:main" }
dependencies = [
    "beautifulsoup4",
    "lxml",
    "pyyaml",
    "brotli",
    "qrcode",
    "APScheduler",
    "pillow",
    "yarl",
    "pycryptodomex",
    "qrcode_terminal",
    "PyJWT",
    "aiohttp>=3.9",
    "httpx>=0.27",
    "curl_cffi>=0.8.1",
]

[tool.setuptools.dynamic]
version = { attr = "bilibili_api.BILIBILI_API_VERSION" }
readme = { file = ["README.md"], content-type = "text/markdown" }

[tool.setuptools]
packages = [
    "bilibili_api",
    "bilibili_api.utils",
    "bilibili_api.exceptions",
    "bilibili_api.clients",
    "bilibili_api.tools",
    "bilibili_api.tools.ivitools",
    "bilibili_api.tools.parser",
    "bilibili_api._pyinstaller",
]

[tool.setuptools.package-data]
"*" = ["data/*.*", "data/**/*.*", "py.typed", "requirements.txt"]

[project.entry-points.pyinstaller40]
"hook-dirs" = "bilibili_api._pyinstaller.entry_points:get_hook_dirs"

[dependency-groups]
dev = [
    "ruff>=0.12",
    "pyrefly>=0.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3",
]

[tool.uv]
package = true

# 全部测试统一由 pytest 运行：离线用例（test_offline_*.py）无需凭据；
# 集成用例由 conftest.py 自动打 integration 标记，缺 BILI_* 环境变量时自动 skip。
# 只跑离线：uv run pytest -m "not integration"；只跑集成：uv run pytest -m integration
# 只读集成子集（无写操作，参与 PR 验证）：uv run pytest -m readonly
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: 需要真实 B 站凭据（BILI_* 环境变量）的集成测试，缺凭据时自动 skip",
    "readonly: 只读集成测试子集（仅 GET 式读请求与反爬虫参数获取，无写操作），参与 PR 快速回路",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "F", # Pyflakes
    "W", # pycodestyle warnings
    "E", # pycodestyle errors
    "I", # isort
    "UP", # pyupgrade
    "ASYNC", # flake8-async
    "B", # flake8-bugbear（可变默认参数 B006 等，2026-08-29 启用防回归）
    "C4", # flake8-comprehensions
    "T10", # flake8-debugger
    "T20", # flake8-print
    "PYI", # flake8-pyi
    "PT", # flake8-pytest-style
    "Q", # flake8-quotes
    "TID", # flake8-tidy-imports
    "RUF", # Ruff-specific rules
]
ignore = [
    "E402", # module-import-not-at-top-of-file
    "E501", # line-too-long：剩余项均位于字符串/docstring 内，交由 ruff format 管理代码行长
    "UP037", # quoted-annotation
    "RUF001", # ambiguous-unicode-character-string
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
    "RUF012", # mutable-class-default：大量 Enum 成员值为 dict，属有意设计
    "TID252", # relative-imports
]

[tool.ruff.lint.per-file-ignores]
# __init__.py 的导入顺序为避免循环引用精心设计，禁止重排
"bilibili_api/__init__.py" = ["I001"]
# parse_link.py 导入顺序为避免循环引用精心设计，禁止重排
"bilibili_api/utils/parse_link.py" = ["I001"]
# ivitools 为命令行工具，允许 print；PyQt6 探测导入。
# 其中 ivitools/player.py 的 2 处裸 `except:`（PyQt6 GUI 探测）为有意保留（对应 E722 豁免）。
"bilibili_api/tools/**" = ["T201", "F401", "E722"]
# install.py 为命令行安装脚本，允许 print
"install.py" = ["T201"]
# scripts/lint.py 为命令行脚本，允许 print
"scripts/lint.py" = ["T201"]
# scripts/check_commit_msg.py 为命令行脚本，允许 print
"scripts/check_commit_msg.py" = ["T201"]
# scripts/type_ratchet.py 为命令行门禁脚本，允许 print
"scripts/type_ratchet.py" = ["T201"]
# 上游有意在异步函数中使用阻塞 open/os.path（读取本地小文件），待后续引入 aiofiles 再改
"bilibili_api/**" = ["ASYNC230", "ASYNC240"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["src", "tests"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pyrefly]
project-includes = ["bilibili_api/**"]
project-excludes = ["tests/**", "docs/**", "scripts/**"]
# 可选依赖（tools 层 PyQt6 / fastapi、_pyinstaller 钩子的 PyInstaller）未安装时
# 以 typing.Any 替代，抑制对应 missing-import；其余类型检查不受影响。
# 注：门禁均以显式路径调用（pyrefly check ./bilibili_api/），此时配置文件的
# project-excludes 不生效，故改用本配置项而非排除目录。
ignore-missing-imports = ["PyQt6", "fastapi", "PyInstaller", "PyInstaller.utils.hooks"]

# 存量类型错误基线豁免（2026-08-06 审计收紧）：以下错误码为上游遗留问题，
# 暂时禁用以保证 CI 门禁可用；应另立任务逐步修复，修复完成后从此表移除对应条目。
# 存量已清零的错误码（bad-override-mutable-attribute / bad-override-param-name）
# 已从豁免表移除并恢复启用。其余错误码（含新增代码引入的类型错误）仍会正常拦截。
# 2026-08-29 起引入存量棘轮（scripts/type_ratchet.py，由 scripts/lint.py 阻断式调用）：
# 豁免类别的存量计数只减不增，新增类型错误会被棘轮拦截；下方行尾计数已按同日复核更新。
[tool.pyrefly.errors]
bad-argument-type = false # 存量 69
bad-assignment = false # 存量 57
bad-function-definition = false # 存量 17
bad-index = false # 存量 286
bad-override = false # 存量 20
bad-return = false # 存量 387
missing-attribute = false # 存量 35
not-iterable = false # 存量 13
unsupported-operation = false # 存量 186
