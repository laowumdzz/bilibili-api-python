name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  schedule:
    # 每周一 04:00 UTC 定时跑集成用例，跟进 B 站接口变更
    - cron: "0 4 * * 1"

jobs:
  commit-lint:
    name: Commit messages (Conventional Commits)
    runs-on: ubuntu-latest
    # 提交信息随仓库传播的兜底校验：本地 commit-msg 钩子依赖 install.py 初始化
    # core.hooksPath 后才生效，可能被跳过；此任务仅校验 PR 增量提交，不追溯 base 分支历史。
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        # 纯标准库脚本，无需安装 uv / 依赖
        run: python scripts/check_commit_msg.py --range "origin/${{ github.base_ref }}" HEAD

  lint:
    name: Lint (ruff + pyrefly, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 覆盖支持区间的两端（最低版本与最新版本），拦截版本相关的语法/依赖回归；
        # 起步两个点以控制 CI 时长，后续可按需扩展至 3.11/3.12。
        python-version: ["3.10", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          # setup-uv 会安装对应版本的 Python 并注册到 uv，后续 uv sync 自动使用该版本建环境；
          # 若本地无 uv 缓存，还会在 uv sync 时按需下载对应版本的 Python。
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run lint
        env:
          # 文档漂移门禁必须真正生效：缓存缺失时 lint.py 会用 mypy==1.18.2 的 stubgen 自动重建，
          # 缓存落后于源码则视为失败（本地默认仅提示）。
          DOCS_DRIFT_STRICT: "1"
        run: uv run python scripts/lint.py

  test:
    name: Test (pytest, offline, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 离线测试是版本回归的核心保障：覆盖支持区间的两端（3.10 与 3.13）。
        python-version: ["3.10", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run pytest
        # 仅离线快速路径：不触碰网络与真实账号，无需 BILI_* 凭据
        run: uv run pytest -m "not integration"

  integration-readonly:
    name: Test (pytest, integration readonly)
    runs-on: ubuntu-latest
    # 单版本策略说明：本 job 及下方 integration 均固定在 3.10。版本矩阵的核心目标是静态检查与离线回归，
    # 集成类任务依赖外部凭据与网络环境，多版本矩阵会成倍增加资源消耗与 412 风控风险，
    # 收益有限，故保持单一基线版本；高版本回归已由上方矩阵覆盖。
    # PR 快速回路：仅运行 readonly 标记的只读集成子集（反爬虫与 API 定义核心面，无写操作）。
    # 反爬与公开接口用例无需凭据；凭据相关只读用例缺凭据时自动 skip 并在任务摘要中提示降级，
    # 不阻塞无凭据贡献者（含 fork PR）。
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync

      - name: Check integration credentials
        env:
          BILI_SESSDATA: ${{ secrets.BILI_SESSDATA }}
          BILI_DEDEUSERID: ${{ secrets.BILI_DEDEUSERID }}
        run: |
          if [ -z "$BILI_SESSDATA" ] || [ -z "$BILI_DEDEUSERID" ]; then
            {
              echo "## ⚠️ 集成验证降级提示"
              echo ""
              echo "本次 PR 未配置 BILI_SESSDATA / BILI_DEDEUSERID 等集成凭据（fork 贡献属正常情况）："
              echo "- 依赖凭据的只读集成用例已自动 skip，不影响合入；"
              echo "- 反爬虫与公开只读接口验证仍正常执行；"
              echo "- 全量集成测试由每周定时任务 / workflow_dispatch 手动触发覆盖。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "缺少集成凭据：凭据相关只读用例将 skip（不阻塞合入）"
          else
            echo "集成凭据已配置：只读集成子集将完整执行"
          fi

      - name: Run pytest (readonly subset)
        env:
          BILI_SESSDATA: ${{ secrets.BILI_SESSDATA }}
          BILI_CSRF: ${{ secrets.BILI_CSRF }}
          BILI_BUVID3: ${{ secrets.BILI_BUVID3 }}
          BILI_DEDEUSERID: ${{ secrets.BILI_DEDEUSERID }}
          BILI_RATELIMIT: "1.5"
        run: uv run pytest -m readonly

  integration:
    name: Test (pytest, integration)
    runs-on: ubuntu-latest
    # 全量集成用例（含写操作）需要真实凭据：仅每周定时与手动触发，不参与 PR 与推送主干；
    # PR 场景由上方 integration-readonly 只读子集覆盖。不在推送时运行的原因：GitHub
    # runner IP 被 B 站 412 风控拦截（NetworkException: 412），推送触发的全量集成必然
    # 失败，且与每周定时覆盖重复；接口漂移追踪由 schedule 全量任务承担。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync

      - name: Run pytest
        env:
          BILI_SESSDATA: ${{ secrets.BILI_SESSDATA }}
          BILI_CSRF: ${{ secrets.BILI_CSRF }}
          BILI_BUVID3: ${{ secrets.BILI_BUVID3 }}
          BILI_DEDEUSERID: ${{ secrets.BILI_DEDEUSERID }}
          BILI_RATELIMIT: "1.5"
          # 每周集成任务强制启用请求计数与 412 中止（特性 007 FR-004 / FR-005）：
          # 会话结束由 conftest 输出总请求数 / 412 计数摘要，总请求数超过 400 或出现
          # 412 类响应（HTTP 412 / -352 等效码）时以非零状态退出。400 为 cred0+cred1
          # 验收预算，此处作为含 cred2 的全会话保守上限（T059 实测全会话 320）。
          BILI_COUNT_REQUESTS: "1"
          BILI_ABORT_ON_RISK: "1"
          BILI_REQUEST_BUDGET: "400"
        # 特性 007：integration 任务切换为 cred0-cred2 分层口径（高危 cred3 层默认收集即排除，
        # 永不在 CI 执行）；如需回退到旧的全量集成口径，改回 `uv run pytest -m integration` 即可
        # （两种口径下 cred3 均被收集期剔除）。
        run: uv run pytest -m "cred0 or cred1 or cred2"
