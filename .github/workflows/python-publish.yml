name: Upload Python Package

on:
  release:
    types: [published]

  workflow_dispatch:

jobs:
  deploy:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv and Python
        # 与 CI 保持一致：统一使用 astral-sh/setup-uv 安装 uv 与 Python，
        # 构建与依赖解析交由 uv 处理，避免与 pyproject.toml 约束脱节。
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"

      - name: Export branch and version
        run: echo "${{ github.ref_name }}|${{ github.event.release.target_commitish }}" > github.txt

      - name: Build sdist and wheel
        # 版本号由 setuptools 动态读取 bilibili_api.BILIBILI_API_VERSION，
        # uv build 自动完成构建环境隔离与打包。
        run: uv build --sdist --wheel

      - name: Publish to PyPI
        # 保留既有 twine + PyPI 账号凭据的发布方式（不引入 OIDC 等需仓库侧额外配置的方案）。
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: uvx twine upload dist/*
