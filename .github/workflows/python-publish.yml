name: Build and Attach to Release

on:
  release:
    types: [published]

  workflow_dispatch:

# 上传 Release 资产需要写权限（仓库默认 token 权限可能为只读）
permissions:
  contents: write

jobs:
  deploy:
    name: Build and attach to GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv and Python
        # 与 CI 保持一致：统一使用 astral-sh/setup-uv 安装 uv 与 Python，
        # 构建与依赖解析交由 uv 处理，避免与 pyproject.toml 约束脱节。
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"

      - name: Build sdist and wheel
        # 版本号由 setuptools 动态读取 bilibili_api.BILIBILI_API_VERSION，
        # uv build 自动完成构建环境隔离与打包。
        run: uv build --sdist --wheel

      - name: Attach dist to GitHub Release
        # 仅发布到 GitHub Release，不再上传 PyPI。
        # release 事件与手动 dispatch 均在 tag ref 上运行，ref_name 即 tag 名；
        # 手动触发时需选择已存在 Release 的 tag，否则 gh 报 release 不存在。
        # --clobber 允许工作流重跑时覆盖同名资产。
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/* --clobber
